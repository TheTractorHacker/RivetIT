server {
    listen 80;
    server_name beta-c.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beta-c.example.test;

    root /var/www/beta-c.example.test;
    index index.php index.html;

    ssl_certificate /etc/ssl/certs/beta-c.example.test.crt;
    ssl_certificate_key /etc/ssl/private/beta-c.example.test.key;

    # This site runs on a newer PHP than the shared snippet's (php8.4), and was given its own MCP routes by hand.
    location = /mcp {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp_server/index.php;
        fastcgi_param SCRIPT_NAME /mcp_server/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_buffering off;
    }

    location = /.well-known/oauth-protected-resource {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp_server/index.php;
        fastcgi_param SCRIPT_NAME /mcp_server/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    include snippets/itflow-locations.conf;
}
