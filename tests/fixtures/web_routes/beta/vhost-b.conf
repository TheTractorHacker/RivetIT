server {
    listen 80;
    server_name beta-b.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beta-b.example.test;

    root /var/www/beta-b.example.test;
    index index.php index.html;

    ssl_certificate /etc/ssl/certs/beta-b.example.test.crt;
    ssl_certificate_key /etc/ssl/private/beta-b.example.test.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    include snippets/itflow-locations.conf;
}
