server {
    listen 80;
    listen [::]:80;
    server_name beta-a.example.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beta-a.example.test;

    root /var/www/beta-a.example.test;
    index index.php index.html;
    client_max_body_size 500M;

    ssl_certificate /etc/ssl/certs/beta-a.example.test.crt;
    ssl_certificate_key /etc/ssl/private/beta-a.example.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/itflow-locations.conf;
}
