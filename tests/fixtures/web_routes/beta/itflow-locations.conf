# Shared location/security rules for itflow.foleyit.com
# Mirrors the .htaccess rules from the application repo (translated since
# nginx does not read .htaccess files).

# Root .htaccess: block .git, .github, and direct config.php access
location ~ ^/(\.git|\.github|config\.php) {
    return 404;
}

# Every dotfile (.env, .env.example, .gitignore, ...) and the deployment
# tooling/docs that ship in the app checkouts - none of it is meant to be
# served. /restore/ is where the repo's Docker Compose flow drops an encrypted
# backup and its passphrase. Same rules as the repo's docker/nginx.conf and
# deploy/templates/nginx-vhost.conf.template. /.well-known/ stays reachable.
location ^~ /.well-known/ {
    try_files $uri =404;
}

location ~ /\. {
    deny all;
}

location ^~ /restore/ {
    deny all;
}

location ~ ^/(deploy|docker|docs)/ {
    deny all;
}

# uploads/ is user-supplied content. Two protections, and they must live together.
#
# `^~` is load-bearing AND dangerous: it suppresses regex-location evaluation for
# this prefix, so the script-deny CANNOT stay at the top level - it is nested
# inside instead. Removing the nested block would silently re-enable PHP
# execution under /uploads/, which is the single worst mistake available here.
#
# Content-Disposition makes a navigated upload download instead of rendering, so
# an uploaded .svg or .html cannot execute script at this app's origin. It does
# NOT affect <img src> embedding, so avatars and logos still display.
location ^~ /uploads/ {
    location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
        deny all;
    }
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# cron/.htaccess + scripts/.htaccess: these run via CLI only, never over HTTP
location ~ ^/(cron|scripts)/.*\.php$ {
    deny all;
}

# backups/.htaccess, config/.htaccess, plugins/TCPDF/tools/.htaccess: deny all
location ^~ /backups/ {
    deny all;
}

location ^~ /config/ {
    deny all;
}

location ^~ /plugins/TCPDF/tools/ {
    deny all;
}

# Legacy per-file API endpoints must NOT be servable directly.
# `location /api/v1/` below is a PLAIN PREFIX, so nginx still evaluates regex
# locations and `location ~ \.php$` wins for any .php under it - which means
# /api/v1/contacts/read.php executed as a standalone script and bypassed
# api/v1/index.php's router entirely, along with its read-only-key gate, its
# client scoping and its refusal to serve credentials to a legacy key.
# This regex must stay ABOVE `location ~ \.php$`: regex locations are tried in
# the order they appear, first match wins.
location ~ ^/api/v1/.+/.+\.php$ {
    deny all;
    return 403;
}

# api/v1/.htaccess: clean-URL front controller
location /api/v1/ {
    try_files $uri /api/v1/index.php?$query_string;
}

# api/v2/.htaccess: clean-URL front controller (nginx does not read .htaccess)
location /api/v2/ {
    try_files $uri /api/v2/index.php?$query_string;
}

# Defense in depth: never serve dotfiles (.htaccess, etc.)
location ~ /\.ht {
    deny all;
}

# SSE: nginx buffers the entire fastcgi response by default, which holds back
# Server-Sent Events until the script exits (sse_ticket_stream.php's
# X-Accel-Buffering header has no effect on fastcgi_pass, only proxy_pass).
# This must come before the generic \.php$ block since nginx picks the first
# matching regex location.
location ~ /sse_ticket_stream\.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 300s;
    fastcgi_buffering off;
}

# API v1 front controller — exact match takes priority over the regex \.php$
# block below, so fastcgi_buffering off applies here (required for SSE stream
# endpoints like /api/v1/tickets/{id}/chat?stream=1 and /api/v1/notifications/stream).
location = /api/v1/index.php {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 300s;
    fastcgi_buffering off;
}

# PHP-FPM
location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 300s;
}

# Static asset caching. /plugins (vendor libs), /fonts, and /css (already
# filemtime-versioned via ?v= in includes/footer.php) are safe for a long,
# immutable cache - they either never change in place or change URL when they
# do. /js is NOT included here: some first-party scripts under it (keepalive.js,
# live_ticket.js, pretty_content.js, ticket_collision_detection.js) are NOT
# ?v=-versioned, so immutable caching could serve a stale copy after an edit -
# gets a short revalidate-friendly max-age instead. /uploads is user content
# and intentionally left alone (a replaced file must be re-fetched).
location ^~ /plugins/ {
    # barcode.php (TOTP QR codes) and PHPMailer's get_oauth_token.php are
    # requested directly and must still run through PHP-FPM - without this
    # nested block, the ^~ prefix match above short-circuits the generic
    # \.php$ regex location and these files are served as raw source text.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300s;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /css/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /js/ {
    add_header Cache-Control "public, max-age=3600";
}

location / {
    try_files $uri $uri/ =404;
}
