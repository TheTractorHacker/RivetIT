# RivetIT — Docker Compose quick start.
#
# For local evaluation or a lightweight self-hosted deployment. This is NOT
# the same tooling as deploy/install.sh (see deploy/README.md) — that's the
# hardened, TLS-terminating, systemd-integrated bare-metal path recommended
# for a production instance you're running long-term. This is the "git
# clone && docker compose up" path: fast to try, deliberately dumb about
# hardening (no fail2ban/ufw/unattended-upgrades equivalent — a container
# has none of those concepts), and expects YOU to put a real reverse proxy
# with TLS in front of it for anything beyond localhost. See the top-level
# README's Docker section for the full walkthrough.
#
# App code is bind-mounted from this checkout (not baked into the image),
# so config.php/uploads/backups/vendor all persist on the host across
# `docker compose down` and image rebuilds, and `git pull` is the update
# path — same model as deploy/update.sh, just without the wrapper script.
#
# Names: the containers are called rivetit-web and rivetit-db, and the
# locally built app image is tagged rivetit-web:local. To run a second stack
# on the same host, set RIVETIT_CONTAINER_PREFIX in that stack's .env: it
# prefixes both container names and the image tag. The service keys (app,
# db) and the itflow_db_data volume keep their original names on purpose:
# an existing stack's database lives in that volume (renaming it starts the
# stack on an empty database), and DB_HOST: db names the service (see
# REBRANDING.md). Do not add a top-level `name:` either; it would change
# the project prefix of that volume.
#
# DB_NAME/DB_USER: the `:-itflow` fallback below is NOT the suggested value
# for a new install (.env.example now suggests "rivetit") — it only fires
# when .env has no DB_NAME/DB_USER set at all, which on an existing stack
# means its database really is named "itflow" inside that volume. Changing
# this fallback would point such a stack at a different, empty database on
# its next `docker compose up`. Leave it as `itflow`.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: "${RIVETIT_CONTAINER_PREFIX:-rivetit}-web:local"
    container_name: "${RIVETIT_CONTAINER_PREFIX:-rivetit}-web"
    depends_on:
      - db
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      # Only consumed for an unattended RESTORE_FROM first boot (see below)
      # — a normal fresh install still gets these interactively from the
      # browser /setup wizard, same as before.
      DB_NAME: "${DB_NAME:-itflow}"
      DB_USER: "${DB_USER:-itflow}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      APP_BASE_URL: "${APP_BASE_URL:-localhost:8080}"
      DOCKER_UID: "${DOCKER_UID:-33}"
      DOCKER_GID: "${DOCKER_GID:-33}"
      # Unset by default — set both in .env to restore a deploy/backup.sh
      # backup on first boot instead of a fresh install. Paths are inside
      # the container; drop the matching files under ./restore/ on the host
      # (see the ./restore mount below and .env.example).
      RESTORE_FROM: "${RESTORE_FROM:-}"
      RESTORE_PASSPHRASE_FILE: "${RESTORE_PASSPHRASE_FILE:-}"
      # Optional product-identity overrides read by includes/branding.php
      # (RIVETIT_<CONSTANT>); empty means the built-in default. Any other
      # constant in that file can be passed through the same way.
      RIVETIT_APP_NAME: "${RIVETIT_APP_NAME:-}"
      RIVETIT_APP_REPO_URL: "${RIVETIT_APP_REPO_URL:-}"
      RIVETIT_APP_REPO_PUBLIC: "${RIVETIT_APP_REPO_PUBLIC:-}"
      RIVETIT_APP_WEBSITE_URL: "${RIVETIT_APP_WEBSITE_URL:-}"
      RIVETIT_APP_DOCS_URL: "${RIVETIT_APP_DOCS_URL:-}"
      RIVETIT_APP_SUPPORT_URL: "${RIVETIT_APP_SUPPORT_URL:-}"
    volumes:
      - .:/var/www/html
      # Always mounted (harmless if empty) so RESTORE_FROM/
      # RESTORE_PASSPHRASE_FILE above can point into it without a separate
      # compose profile — put your backup-*.tar.gz.enc and passphrase file
      # here to restore instead of running a fresh install.
      - ./restore:/var/www/restore:ro
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: "${RIVETIT_CONTAINER_PREFIX:-rivetit}-db"
    environment:
      MARIADB_DATABASE: "${DB_NAME:-itflow}"
      MARIADB_USER: "${DB_USER:-itflow}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}"
    volumes:
      - itflow_db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  itflow_db_data:
