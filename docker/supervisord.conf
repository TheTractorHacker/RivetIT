# RivetIT — Docker Compose process supervisor.
#
# Three long-running things in one container: php-fpm, nginx, and a cron
# stand-in. A real cron daemon inside a container is more fragile than it's
# worth here (PID 1/signal handling, logging to a syslog that doesn't
# exist) — deploy/install.sh's system cron entry runs cron/cron.php every 5
# minutes as www-data, so a plain sleep-loop program reproduces that exactly
# (the same for mail_queue.php and ticket_email_parser.php, which install.sh
# also schedules every 5 minutes; each checks its own feature setting)
# with far less moving parts. Like the bare-metal cron entry, this is inert
# until "Enable Cron" is turned on in the app's own Settings — see the
# top-level README's Docker section.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
; includes/redis_functions.php hardcodes 127.0.0.1:6380 (chosen there to
; avoid colliding with an unrelated stack's default 6379 on the bare-metal
; host) and degrades gracefully if nothing answers — ticket/chat updates
; just stop live-pushing rather than the app breaking. Running it in this
; same container keeps that 127.0.0.1 assumption true without touching the
; app code; --daemonize no is required under supervisord, which expects the
; process it manages to stay in the foreground.
command=redis-server --port 6380 --bind 127.0.0.1 --daemonize no --save ""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=docker-php-entrypoint php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/cron.php' >> /dev/stdout 2>&1; sleep 300; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mail_queue]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/mail_queue.php' >> /dev/stdout 2>&1; sleep 300; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ticket_email_parser]
command=/bin/sh -c "while true; do su -s /bin/sh www-data -c 'php /var/www/html/cron/ticket_email_parser.php' >> /dev/stdout 2>&1; sleep 300; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
