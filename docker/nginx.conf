# ITFlow-Internal-IT — Docker Compose nginx vhost.
#
# Plain HTTP only, on purpose: this container does not terminate TLS. Put it
# behind your own reverse proxy (Traefik, Caddy, nginx-proxy, a cloud LB —
# anything that speaks HTTP to this container's published port and HTTPS to
# the internet) for anything beyond local evaluation. See
# deploy/templates/nginx-vhost.conf.template for the bare-metal installer's
# direct-TLS/proxy-mode vhost if you want this box to terminate TLS itself
# instead.
#
# The location blocks below are a deliberate subset of that same template —
# every /uploads/ script-deny, the KB media deny, the config.php/.git deny,
# the api/v1 legacy-leaf-script deny, and the response security headers.
# Kept in sync by hand; if you change one, check the other.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 500M;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(\.git|\.github|config\.php) {
        return 404;
    }

    # This server's root is the whole checkout (docker-compose.yml mounts
    # ".:/var/www/html"), which is also where Compose reads .env (DB
    # passwords, plus the RESTORE_* filenames) and where ./restore/ holds an
    # encrypted backup and its passphrase. Deny every dotfile and the restore
    # drop folder outright, and the deployment tooling/docs beside them -
    # none of it is ever meant to be fetched over HTTP. /.well-known/ stays
    # reachable for ACME.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /restore/ {
        deny all;
    }

    location ~ ^/(deploy|docker|docs)/ {
        deny all;
    }

    location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
        deny all;
    }

    location ^~ /uploads/kb/ {
        deny all;
    }

    location ^~ /uploads/ {
        location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
            deny all;
        }
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Disposition "attachment" always;
    }

    location ~ ^/(cron|scripts)/.*\.php$ {
        deny all;
    }

    location ^~ /backups/ {
        deny all;
    }

    location ^~ /config/ {
        deny all;
    }

    location ^~ /plugins/TCPDF/tools/ {
        deny all;
    }

    location ~ ^/api/v1/.+/.+\.php$ { deny all; return 403; }

    location /api/v1/ {
        try_files $uri /api/v1/index.php?$query_string;
    }

    location /api/v2/ {
        try_files $uri /api/v2/index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ ^/(login|setup)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ~ /sse_ticket_stream\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location = /api/v1/index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ^~ /plugins/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /js/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
