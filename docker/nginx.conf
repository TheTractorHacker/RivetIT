# RivetIT — Docker Compose nginx vhost.
#
# Plain HTTP only, on purpose: this container does not terminate TLS. Put it
# behind your own reverse proxy (Traefik, Caddy, nginx-proxy, a cloud LB —
# anything that speaks HTTP to this container's published port and HTTPS to
# the internet) for anything beyond local evaluation. See
# deploy/templates/nginx-vhost.conf.template for the bare-metal installer's
# direct-TLS/proxy-mode vhost if you want this box to terminate TLS itself
# instead.
#
# The location blocks below are a deliberate subset of that same template —
# every /uploads/ script-deny, the KB media deny, the config.php/.git deny,
# the api/v1 legacy-leaf-script deny, and the response security headers.
# Kept in sync by hand; if you change one, check the other.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 500M;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/(\.git|\.github|config\.php) {
        return 404;
    }

    # This server's root is the whole checkout (docker-compose.yml mounts
    # ".:/var/www/html"), which is also where Compose reads .env (DB
    # passwords, plus the RESTORE_* filenames) and where ./restore/ holds an
    # encrypted backup and its passphrase. Deny every dotfile and the restore
    # drop folder outright, and the deployment tooling/docs beside them -
    # none of it is ever meant to be fetched over HTTP. /.well-known/ stays
    # reachable for ACME.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ^~ /restore/ {
        deny all;
    }

    location ~ ^/(deploy|docker|docs)/ {
        deny all;
    }

    # Non-public source trees and metadata (pentest F-02). Anchored at the web
    # root so agent/includes, client/includes etc. are unaffected. /mcp is routed
    # by its own exact-match location, not through this path; /mcp_server is only ever reached through that location.
    location ~ ^/(tests|vendor|src|includes|odoo_addons|mcp_server|setup/setup_functions\.php) {
        deny all;
    }

    location ~* ^/[^/]+\.(md|lock|sql|yml|yaml)$ {
        deny all;
    }

    location = /composer.json {
        deny all;
    }

    location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
        deny all;
    }

    location ^~ /uploads/kb/ {
        deny all;
    }

    # Training content media. INTERNAL: reachable only via X-Accel-Redirect from
    # agent/training_media.php, which authorizes every request from the database
    # first. nginx then serves the bytes (sendfile, Range/206 for iOS video) so a
    # 95 MB MP4 never holds a PHP-FPM worker. Evidence is never served.
    # add_header does not inherit into a location that declares its own, so the
    # server-level headers are repeated here.
    location ^~ /uploads/training/ {
        internal;
        location ~ \.(php|phtml|phar|phps|cgi|pl|sh)$ { deny all; }
        location ^~ /uploads/training/evidence/ { deny all; }
        types {
            application/pdf pdf; image/jpeg jpg; image/png png; image/webp webp; image/gif gif; video/mp4 mp4;
            text/plain txt; text/csv csv; text/vtt vtt;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
        }
        default_type application/octet-stream;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # The Windows kiosk-mode start URL /kiosk/?d=<token>: the token is a device credential, so this
    # hop is answered here - never logged, never reaching PHP - with a redirect to the fragment form,
    # which no server sees (the page adopts it by POST). kiosk/index.php does the same 302 where this
    # rule is missing. Anything else at /kiosk/ falls through to the directory index as before.
    location = /kiosk/ {
        absolute_redirect off;   # a relative Location: right behind a TLS-terminating proxy too
        if ($args ~ "^d=([A-Za-z0-9_-]{43})$") {
            access_log off;
            return 302 /kiosk/#d=$1;
        }
        # The fleet link /kiosk/?e=<fleet token>&sn=<serial> (MDM mass deployment): the same hop, the same reason.
        if ($args ~ "^e=(rvkf1_[A-Za-z0-9_-]{43})(?:&sn=([^&]{0,100}))?(?:&.*)?$") {
            access_log off;
            return 302 "/kiosk/#e=$1&sn=$2";
        }
    }

    # Training kiosk (/kiosk/, P3 spec §7.11). A public path outside /agent/, so an edge challenge on
    # /agent/* never interrupts employees (plan A19); every kiosk PHP request authenticates itself
    # (device cookie + PIN session). The include files are never entry points: "^~" beats every regex.
    location ^~ /kiosk/includes/ {
        deny all;
    }

    # Kiosk PHP: the pages send their own CSP and Referrer-Policy (no-referrer, or
    # strict-origin-when-cross-origin on the video page), so the server-level Referrer-Policy must not
    # apply here; declaring add_header drops the inherited set, and the rest is repeated. Must stay
    # above the generic "location ~ \.php$" (nginx takes the first matching regex).
    location ~ ^/kiosk/.*\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /uploads/ {
        location ~ ^/uploads/.*\.(php|phtml|phar|phps|cgi|pl|sh)$ {
            deny all;
        }
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Disposition "attachment" always;
    }

    location ~ ^/(cron|scripts)/.*\.php$ {
        deny all;
    }

    location ^~ /backups/ {
        deny all;
    }

    location ^~ /config/ {
        deny all;
    }

    location ^~ /plugins/TCPDF/tools/ {
        deny all;
    }

    location ~ ^/api/v1/.+/.+\.php$ { deny all; return 403; }

    location /api/v1/ {
        try_files $uri /api/v1/index.php?$query_string;
    }

    location /api/v2/ {
        try_files $uri /api/v2/index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ ^/(login|setup)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ~ /sse_ticket_stream\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location = /api/v1/index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    # The one agent page the app frames itself (in-window video check). The page sends
    # CSP frame-ancestors 'self' instead of X-Frame-Options (same pattern as kb_embed_serve.php).
    # Same fastcgi lines as the generic PHP location below; the server-level headers are
    # repeated WITHOUT X-Frame-Options (declaring add_header here drops the inherited set).
    location = /agent/training_video_frame.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Remote MCP: Streamable HTTP endpoint, protected-resource and authorization-server metadata (the built-in OAuth server,
    # docs/REMOTE_MCP.md). The PHP endpoint answers 404 until Remote MCP is switched on.
    location = /mcp {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp_server/index.php;
        fastcgi_param SCRIPT_NAME /mcp_server/index.php;
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }

    location = /.well-known/oauth-protected-resource {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp_server/index.php;
        fastcgi_param SCRIPT_NAME /mcp_server/index.php;
    }

    location = /.well-known/oauth-authorization-server {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/mcp_server/index.php;
        fastcgi_param SCRIPT_NAME /mcp_server/index.php;
    }

    # OAuth endpoints that hand out, register or revoke tokens: never cached anywhere. add_header does not inherit into a
    # location that declares its own, so the server-level headers are repeated. authorize.php (the consent screen) keeps
    # X-Frame-Options DENY and also sends CSP frame-ancestors 'none'.
    location ~ ^/oauth/(token|register|revoke|authorize)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }

    location ^~ /plugins/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /js/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
