        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectDetail'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /contracts:
    get:
