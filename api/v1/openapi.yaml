        client_visible: {type: integer}
        updated_at: {type: string}
    KbAttachment:
      type: object
      description: >
        A KB article attachment. NOTE the shape differs from the shared
        `Attachment` schema used by tickets: this one carries `id` and has no
        `filename`. It always did - the spec previously pointed at `Attachment`
        and was simply wrong about it.
      properties:
        id: {type: integer, description: kb_article_attachments.kb_article_attachment_id}
        name: {type: string, description: The original filename as uploaded.}
        url:
          type: string
          description: >
            A SHORT-LIVED, SIGNED, ABSOLUTE URL. Fetch it with no credentials of
            any kind - the signature in the query string IS the credential,
            which is what lets an external browser or a WebView (neither of which
            can send `Authorization` or `X-Api-Key`) open it.


            Shape:
            `https://<host>/agent/kb_media.php?att=<id>&p=<principal>&e=<unix expiry>&s=<hmac-sha256>`.


            Valid for 24 hours, and bound to the CREDENTIAL that requested it -
            a URL minted for your token is not usable by anyone else, and it
            stops working the moment that token or key is revoked, expires, or
            its user is disabled, archived or loses `module_kb`. Permissions are
            re-derived from the database on every fetch, so the URL is proof of
            identity and never a grant. Do not cache it, store it, or share it;
            re-request the article to get a fresh one.


            Adding `&download=1` forces a download instead of an inline preview.
            That parameter is deliberately outside the signature, so the same URL
            serves both. PDFs and common image types preview inline; everything
            else downloads.


            FALLBACK, when this install cannot sign - it has no configured base
            URL, or the signing key does not exist because the database is still
            below version 2.6.78. The URL is then ROOT-RELATIVE, and which
            relative form you get says what to do with it:


            * `/uploads/kb/<article_id>/<stored filename>` - the pre-2.6.78
            shape, emitted only while the database has not been migrated and the
            file is verified present on disk. Resolve it against your server URL
            and fetch it; it works with no credentials, exactly as this endpoint
            behaved before signing existed. It disappears the moment the
            database update runs.


            * `/agent/kb_media.php?att=<id>` - the canonical authenticated form,
            emitted on a migrated install that still cannot sign (a broken
            configuration). It needs a browser session cookie and will NOT work
            from the API. Treat a redirect to the login page as "media
            unavailable", not as an error to retry.
    KbArticleDetail:
      allOf:
        - $ref: '#/components/schemas/KbArticleListItem'
        - type: object
          properties:
            content:
              type: string
              description: >
                Article body as HTML, run through HTMLPurifier. Every KB media
                reference the importers and the editor uploader produce -
                `/uploads/kb/<article_id>/<file>` and flat `/uploads/kb/<file>`,
                in `src`, `href` and CSS `url()` - is replaced with a signed
                absolute URL of the same form as `KbAttachment.url`
                (`?a=<article_id>&f=<file>&p=&e=&s=`), valid for 2 hours and
                fetchable with no headers. Render the string directly (e.g.
                Android's `WebView.loadDataWithBaseURL`) and the images load
                over the plain network stack. `alt` is empty rather than derived
                from the filename, so no part of the token is ever exposed as
                text.


                WHAT IS *NOT* REWRITTEN, stated exactly rather than promised
                away: a `/uploads/...` path that is not one of those two shapes
                is passed through untouched. That means a nested subdirectory
                (`/uploads/kb/13/sub/x.png`), a filename outside
                `[A-Za-z0-9_-]+.[A-Za-z0-9]+` (a space, which purification
                percent-encodes, or a second dot as in `archive.tar.gz`), and
                anything elsewhere under `/uploads/` such as a ticket
                screenshot pasted into an article. None of these can be
                produced by the DOCX importer, the PDF importer or the editor
                uploader - every name they generate is hex or base64url plus a
                single extension - and the media endpoint would refuse the first
                two anyway, so rewriting them would trade a working URL for a
                guaranteed 403. Treat them as ordinary relative URLs.


                When this install cannot sign, the whole body is emitted exactly
                as stored: pre-2.6.78 that is the legacy `/uploads/kb/...` form,
                which is fetchable and is what this endpoint returned before
                signing existed; from 2.6.78 it is the canonical
                `/agent/kb_media.php?...` form, which needs a session cookie.
                See `KbAttachment.url` for the same two cases.
            attachments: {type: array, items: {$ref: '#/components/schemas/KbAttachment'}}
    UserProfile:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        type: {type: integer}
        color: {type: string, nullable: true}
        avatar: {type: string, nullable: true}
        modules:
          type: object
          description: >
            Feature-module flags relevant to client UIs, such as gating
            ticket charges in RivetIT's mobile app.
          properties:
            accounting_enabled: {type: boolean}
            ticket_charges_enabled: {type: boolean}
        is_admin: {type: boolean, description: The login's role is an administrator role (every permission is 3).}
        limited:
          type: boolean
          description: >
            A module-only login (no Departments, Tickets/assets/docs or Assets, e.g. Training only). The API
            then allows only /me, /notifications and /kb, /reports, /alerts for modules the role holds;
            everything else answers 403.
        permissions:
          type: object
          description: >
            Every module (module_client, module_support, module_assets, module_training, ...) with this
            login's level - 0 none, 1 view, 2 edit, 3 full - so the app can hide screens it cannot open.
            Asset screens accept module_assets or module_support.
          additionalProperties: {type: integer, minimum: 0, maximum: 3}
    UpdateProfileRequest:
      type: object
      description: >
        One of several shapes. Profile update: name+email (+ current_password/new_password).
        Push registration: fcm_token. Biometric registration: device_public_key_pem.
      properties:
        name: {type: string}
        email: {type: string}
        current_password: {type: string}
        new_password: {type: string}
        fcm_token: {type: string}
        device_public_key_pem: {type: string}
    Appointment:
      type: object
      properties:
        id: {type: integer}
        ticket_id: {type: integer}
        number: {type: integer}
        subject: {type: string}
        schedule: {type: string, nullable: true}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string, nullable: true}
        priority: {type: string, nullable: true}
        status: {type: string, nullable: true}
        status_color: {type: string, nullable: true}
        client: {type: string, nullable: true}
        assigned_to: {type: string, nullable: true}
    CreateAppointmentRequest:
      type: object
      required: [ticket_id, schedule_start]
      properties:
        ticket_id: {type: integer}
        schedule_start: {type: string, description: "Y-m-d H:i:s"}
        schedule_end: {type: string, nullable: true}
        onsite: {type: boolean}
        notes: {type: string}
    ApprovalList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ApprovalItem'}
        counts:
          type: object
          properties:
            total: {type: integer}
    ApprovalItem:
      type: object
      properties:
        kind: {type: string, enum: [catalog_request, workflow_task]}
        id: {type: integer, description: "request_id (catalog_request) or run_task_id (workflow_task)"}
        title: {type: string}
        requester: {type: string}
        summary: {type: string}
        risk_score: {type: integer, nullable: true}
        step: {type: string, nullable: true}
        ticket_id: {type: integer, nullable: true}
        requested_at: {type: string, example: "2026-10-06 09:00:00"}
        due_at: {type: string, nullable: true}
        fields:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              value: {type: string}
    ApprovalDecision:
      type: object
      required: [kind, id, decision]
      properties:
        kind: {type: string, enum: [catalog_request, workflow_task]}
        id: {type: integer}
        decision: {type: string, enum: [approve, reject]}
        comment: {type: string, description: "Required for reject; up to 2000 characters"}
    CatalogList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              description: {type: string}
              icon: {type: string}
              requires_approval: {type: boolean}
              risk_score: {type: integer}
              fields:
                type: array
                items:
                  type: object
                  properties:
                    key: {type: string}
                    label: {type: string}
                    type: {type: string, enum: [text, textarea, select, checkbox, date, number]}
                    options: {type: array, items: {type: string}}
                    required: {type: boolean}
                    placeholder: {type: string}
                    show_if: {type: object, nullable: true, description: "Show this field only when an earlier field matches: {field, op: equals|in|not_empty, value}. A hidden field is never required and its answer is ignored. null = always visible."}
        popular: {type: array, items: {type: integer}}
        recent: {type: array, items: {type: integer}}
    CatalogRequest:
      type: object
      required: [catalog_item_id]
      properties:
        catalog_item_id: {type: integer}
        answers: {type: object, additionalProperties: true, description: "field key to value; booleans and numbers are accepted for checkbox/number fields"}
        client_id: {type: integer, nullable: true}
    WorkflowTaskList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              run_id: {type: integer}
              run_title: {type: string}
              task_title: {type: string}
              instructions: {type: string}
              due_at: {type: string, nullable: true}
              status: {type: string, enum: [pending, blocked, running, action_failed, rejected]}
              type: {type: string, enum: [manual, approval, action]}
              blocked_by: {type: array, items: {type: string}}
              contact_name: {type: string}
              assignee: {type: string, nullable: true}
        counts:
          type: object
          properties:
            open: {type: integer}
            overdue: {type: integer}
    WorkflowTaskAction:
      type: object
      required: [id, action]
      properties:
        id: {type: integer}
        action: {type: string, enum: [complete, skip]}
        reason: {type: string, description: "Required for skip; up to 500 characters"}
    TicketAttachmentList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              size: {type: integer}
              mime: {type: string}
              created_at: {type: string}
              uploaded_by: {type: string, nullable: true}
    Notification:
      type: object
      properties:
        id: {type: integer}
        type: {type: string, description: "'approval' for an approval request (route on it with kind + ref_id); otherwise the notification category, e.g. Ticket"}
        message: {type: string}
        action: {type: string, nullable: true}
        timestamp: {type: string}
        kind: {type: string, enum: [catalog_request, workflow_task], description: "Only when type is approval"}
        ref_id: {type: integer, description: "Only when type is approval: the approval id to pass to POST /approvals"}
    Alert:
      type: object
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        severity: {type: string, enum: [critical, error, warning, info]}
        message: {type: string}
        subject: {type: string, nullable: true}
        client_id: {type: integer, nullable: true}
        client_name: {type: string, nullable: true}
        status: {type: string}
        created_at: {type: string}
        ticket_id: {type: integer, nullable: true}
        ticket_label: {type: string, nullable: true}
    AlertActionRequest:
      type: object
      required: [source, id, action]
      properties:
        source: {type: string, enum: [rmm, backup]}
        id: {type: integer}
        action: {type: string, enum: [acknowledge, resolve]}
