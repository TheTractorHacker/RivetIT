        '200':
          description: Paged contract list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/ContractListItem'}}
                  total: {type: integer}
                  page: {type: integer}
                  limit: {type: integer}
