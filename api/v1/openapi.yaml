  /reports/unbilled-tickets:
    get:
      tags: [Reports]
      summary: Clients with unbilled billable closed tickets
      parameters:
        - {$ref: '#/components/parameters/YearParam'}
      responses:
        '200': {$ref: '#/components/responses/ReportObject'}
  /reports/expiring:
    get:
      tags: [Reports]
      summary: Domains or certificates expiring within N days
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [domains, certificates], default: domains}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
      responses:
        '200': {$ref: '#/components/responses/ReportObject'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /reports/overview:
    get:
      tags: [Reports]
      summary: Open-ticket breakdown by priority/status/category plus avg resolution
      parameters:
        - {$ref: '#/components/parameters/YearParam'}
      responses:
        '200': {$ref: '#/components/responses/ReportObject'}
  /kb/categories:
    get:
      tags: [Knowledge Base]
      summary: List KB categories (bare array)
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KbCategory'}}
  /kb/articles:
    get:
      tags: [Knowledge Base]
      summary: List KB articles (paged, filterable)
      parameters:
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: client_id, in: query, schema: {type: integer}}
        - {$ref: '#/components/parameters/SearchParam'}
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
      responses:
        '200':
          description: Paged article list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/KbArticleListItem'}}
                  total: {type: integer}
  /kb/articles/{id}:
    get:
      tags: [Knowledge Base]
      summary: KB article detail (content + attachments)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Article detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KbArticleDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
  /me:
    get:
      tags: [Profile]
      summary: Current user profile. Requires a user token (API keys are denied).
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserProfile'}
    put:
      tags: [Profile]
      summary: Update profile / password, or register FCM push or biometric key
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Profile]
      summary: Update profile / password (alias of PUT - FCM push and biometric key registration require PUT)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /appointments:
    get:
      tags: [Appointments]
      summary: List ticket appointments (bare array)
      parameters:
        - {name: when, in: query, schema: {type: string, enum: [past, today, future], default: future}}
        - {name: mine, in: query, schema: {type: integer, enum: [0, 1]}}
        - {name: client_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Appointments
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Appointment'}}
    post:
      tags: [Appointments]
      summary: Create a ticket appointment (schedule entry)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAppointmentRequest'}
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: integer}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications:
    get:
      tags: [Notifications]
      summary: List undismissed notifications (paged)
      parameters:
        - {$ref: '#/components/parameters/PageParam'}
        - {$ref: '#/components/parameters/LimitParam'}
      responses:
        '200':
          description: Paged notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Notification'}}
                  total: {type: integer}
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a single notification read/dismissed
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications read/dismissed
      responses:
        '200': {$ref: '#/components/responses/Ok'}
  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Server-Sent Events stream of new notifications
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}
  /approvals:
    get:
      tags: [Mobile]
      summary: Approvals the caller may decide right now (service catalog requests + workflow approval tasks)
      description: >
        Needs a user token (API keys denied) and Tickets (catalog) and/or Departments (workflow) access.
        Same rules as agent/service_catalog_approvals.php and the workflow run page; administrators also see every
        other pending catalog request (decided as an override). Module-only (limited) logins get 403.
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Mobile]
      summary: Approve or reject one approval
      description: >
        Goes through ServiceCatalogService::decide / WorkflowService::approveTask|rejectTask, so state machine,
        notifications, audit and ticket hold/release behave as on the web. An id that does not exist, is already
        decided, or is not addressed to the caller returns the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string, description: "approved, rejected, or pending_approval (a further catalog step is now waiting)"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Lost a race - the approval was decided in the meantime
        '422':
          description: Validation error (bad kind/id/decision, or a reject without a comment)
  /automation_rules:
    get:
      tags: [Automation]
      summary: List event rules
      description: >
        Administrators only, user token only (an integration client gets 403). The webhook signing secret is never returned
        (action_config.has_secret says whether one is set).
      parameters:
        - {name: q, in: query, schema: {type: string}, description: Matches name or trigger event}
        - {name: trigger_event, in: query, schema: {type: string}}
        - {name: action_type, in: query, schema: {type: string}}
        - {name: enabled, in: query, schema: {type: string, enum: ['0', '1']}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Rules, ordered by event then priority
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: {type: array, items: {$ref: '#/components/schemas/AutomationRule'}}
                  total: {type: integer}
                  limit: {type: integer}
                  offset: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Automation]
      summary: Create an event rule
      description: >
        The same validation as the Event rules editor. action_config is the action's input (see docs/AUTOMATION.md, "Rules over the API"):
        e.g. send_mail {to_type, subject, body, address|user_id}, notify_chat {destination, message}, run_script {script_id, run_as_user_id, params, timeout_s}.
        Risky actions (run_script, create_odoo_user, entra_*) can be saved but do nothing until their switch / integration is set up.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationRuleInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {rule: {$ref: '#/components/schemas/AutomationRule'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Validation error (the message names the problem)}
  /automation_rules/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Automation]
      summary: One event rule, with its last run and run counts
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema: {type: object, properties: {rule: {$ref: '#/components/schemas/AutomationRule'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Automation]
      summary: Replace an event rule (name, trigger_event, action_type and action_config are required)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationRuleInput'}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {type: object, properties: {rule: {$ref: '#/components/schemas/AutomationRule'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: Validation error}
    patch:
      tags: [Automation]
      summary: Change some fields of an event rule (omitted fields, including action_config, are kept)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationRuleInput'}
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: {type: object, properties: {rule: {$ref: '#/components/schemas/AutomationRule'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: Validation error}
    delete:
      tags: [Automation]
      summary: Delete an event rule (its run log rows stay)
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object, properties: {deleted: {type: boolean}, rule_id: {type: integer}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automation_rules/runs:
    get:
      tags: [Automation]
      summary: The rule run log
      parameters:
        - {name: rule_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [ok, failed, throttled, loop_blocked, skipped]}}
        - {name: event, in: query, schema: {type: string}}
        - {name: failed, in: query, schema: {type: string, enum: ['1']}, description: Failed runs only}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs: {type: array, items: {$ref: '#/components/schemas/AutomationRun'}}
                  total: {type: integer}
                  counts: {type: object, additionalProperties: {type: integer}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /automation_rules/runs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Run id}
    get:
      tags: [Automation]
      summary: One run
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: {type: object, properties: {run: {$ref: '#/components/schemas/AutomationRun'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /automation_rules/retry/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Id of the FAILED run to repeat}
    post:
      tags: [Automation]
      summary: Run a failed run again by hand
      description: >
        Uses the event the failed run kept and creates a new run (source "manual", retry_of_run_id = this run). Refused with 409 when the run did not fail,
        kept no event, its rule is gone or off, or a retry of it already succeeded.
      responses:
        '200':
          description: The new run's result (status may still be failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  ok: {type: boolean}
                  message: {type: string}
                  run_id: {type: integer}
                  retry_of_run_id: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Cannot be run again (the message says why)}
  /automation_rules/meta:
    get:
      tags: [Automation]
      summary: Events, actions, condition operators and enrichment fields the editor offers
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema: {type: object}
        '403': {$ref: '#/components/responses/Forbidden'}
  /service_catalog:
    get:
      tags: [Mobile]
      summary: Active service catalog items with their request forms
      description: Needs a user token and Tickets access. categories = the tile groups; popular = top 5 items of the last 30 days; recent = the caller's last 5 distinct items.
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Mobile]
      summary: Raise a ticket from a catalog item
      description: >
        Validated exactly like the web form (required, type, select choices, table rows and cells, 500/5000 length caps); answers
        whose key is not a defined field are ignored. The caller is the requester. Needs Tickets edit access and access to
        client_id's department. The request's risk score is computed from the answers and routes it to the matching approval chain.
        This endpoint is a thin wrapper over ServiceCatalogService::createRequest(), which is the entry point chat integrations
        (Slack / Teams) are meant to call.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRequest'}
      responses:
        '201':
          description: Ticket created (held when the item needs approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  ticket_id: {type: integer}
                  status: {type: string, enum: [created, pending_approval]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Validation error; error holds the messages joined, errors the list
  /workflow_tasks:
    get:
      tags: [Mobile]
      summary: Open onboarding/offboarding checklist tasks
      description: >
        scope=mine (default): assigned to the caller plus unassigned tasks of runs the caller may access (Departments
        view + department access). scope=all: every open task of accessible runs, needs Departments edit access.
        status can also be running or rejected besides the listed values.
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine, all], default: mine}}
      responses:
        '200':
          description: Tasks, soonest due first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowTaskList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Unknown scope
    post:
      tags: [Mobile]
      summary: Complete or skip a checklist task
      description: >
        Same rules as the web handlers (WorkflowService): blocked tasks and approval tasks cannot be completed by hand,
        skipping needs a reason, only administrators may skip an approval. Unknown and inaccessible tasks return the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowTaskAction'}
      responses:
        '200':
          description: Done; status is the task's new status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Validation error or a workflow rule (blocked, needs approval, reason required, admin only)
  /hr_requests:
    get:
      tags: [Mobile]
      summary: HR requests from the employee portal
      description: >
        Onboarding, offboarding and role-change requests that managers and department administrators made in the portal
        (Administration > Settings > Employee portal > HR requests). Nothing has started until a request is approved. Needs
        Departments edit access; only requests of departments the caller may access are listed. A user token is required.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, cancelled], default: pending}}
      responses:
        '200':
          description: Requests, newest first (at most 100); templates lists the workflow templates that can be started for a pending request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HrRequestList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Unknown status
    post:
      tags: [Mobile]
      summary: Approve or reject an HR request
      description: >
        approve needs template_id (an active template of the request's type) and starts that workflow through WorkflowService;
        reject needs a comment and starts nothing. A request outside the caller's departments and an unknown id return the same 404;
        a request that was already decided returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HrRequestDecision'}
      responses:
        '200':
          description: Decided; run_id is the started workflow run (approve only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string, enum: [approved, rejected]}
                  run_id: {type: integer, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Already decided
        '422':
          description: Validation error (no template, wrong template type, reject without a comment, the person has left)
  /ticket_attachments:
    get:
      tags: [Mobile]
      summary: List a ticket's attachments, or download one
      description: >
        ticket_id=N lists. id=A&download=1 streams the file (Content-Disposition: attachment, nosniff, Cache-Control: no-store);
        id=A without download returns that one item's metadata. 403 for a ticket outside the caller's departments and for
        an unknown id (indistinguishable). Needs Tickets access.
      parameters:
        - {name: ticket_id, in: query, schema: {type: integer}}
        - {name: id, in: query, schema: {type: integer}}
        - {name: download, in: query, schema: {type: integer, enum: [1]}}
      responses:
        '200':
          description: Attachment list, or the file bytes when download=1
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketAttachmentList'}
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The file behind a known attachment is missing
    post:
      tags: [Mobile]
      summary: Upload one attachment (multipart)
      description: >
        Fields ticket_id, optional reply_id (must belong to the ticket) and file. Same extension allow-list as the web
        upload, plus content sniffing (an image extension must hold an image; script/markup content is refused), a
        check of every extension segment (shell.php.png is refused), a random stored name and the PHP/post size limits.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ticket_id, file]
              properties:
                ticket_id: {type: integer}
                reply_id: {type: integer}
                file: {type: string, format: binary}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: File too large
        '422':
          description: Missing field, disallowed type or content
  /alerts:
    get:
      tags: [Alerts]
      summary: List combined RMM and backup alerts
      parameters:
        - {name: status, in: query, schema: {type: string, default: new}}
        - {name: severity, in: query, schema: {type: string, enum: [critical, error, warning, info]}}
        - {name: source, in: query, schema: {type: string, enum: [all, rmm, backup]}}
        - {name: client_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Alert'}}
                  total: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Alerts]
      summary: Acknowledge or resolve an alert
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /validate_api_key:
    get:
      tags: [Meta]
      summary: Validate the presented access token (probe)
      responses:
        '200':
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: string, example: "True"}
                  message: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /openapi:
    get:
      tags: [Meta]
      summary: This OpenAPI 3.0 spec as YAML (public)
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
  /docs:
    get:
      tags: [Meta]
      summary: Human-readable HTML API reference (public, self-contained)
      security: []
      responses:
        '200':
          description: HTML docs page
          content:
            text/html:
              schema: {type: string}
  /agent_enroll:
    post:
      tags: [Endpoint agent]
      summary: Enroll a Windows endpoint agent (device-facing, no Bearer)
      description: >
        Exchanges a short-lived enrollment token (carried in the body) for a unique per-device credential, shown once; only its SHA-256 is
        stored. Same install_id again, or a reinstall of the same machine (machine_guid or serial), keeps the device id and rotates the
        credential. Two different machines are never merged: ambiguous, out-of-department, hostname-only or already-owned matches return
        status pending_approval or ambiguous and wait for an administrator. TLS required. Rate limited per address (429 + Retry-After).
        See docs/ENDPOINT_AGENT.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentEnrollRequest'}
      responses:
        '201':
          description: Enrolled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEnrollResponse'}
        '401': {description: "Error code invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled, token exhausted, or the device was revoked/retired (code forbidden)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "install_id belongs to a different machine (code conflict)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body too large", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid body (code invalid)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Too many attempts (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_checkin:
    post:
      tags: [Endpoint agent]
      summary: "Device check-in: inventory, metrics, checks (device credential)"
      description: >
        Idempotent by (device_id, seq): a retried check-in is acknowledged but never double counted. A missing metric (null or absent) is
        never stored as zero. collected_at must not be in the future (5 minutes skew) or older than the retention window; invalid buffered
        samples are dropped, not fatal. Feeds the existing asset RMM link, device metrics and RMM alerts (debounced, deduplicated).
        Optional extra field update_result {version, state ok|failed|rolled_back, detail} reports the last agent update.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCheckinRequest'}
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCheckinResponse'}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 1 MiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid payload", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_jobs:
    get:
      tags: [Endpoint agent]
      summary: Fetch this device's signed jobs (device credential, optional long poll)
      description: >
        Returns only the calling device's queued jobs, each signed (Ed25519 over the canonical JSON of the job fields). wait=1..5 holds the
        request open up to that many seconds. A destructive job (reboot, or flagged) is offered at most once; a harmless job whose
        acknowledgement was lost is re-offered with attempt + 1. A revoked device gets 401 revoked immediately.
      security: [{deviceAuth: []}]
      parameters:
        - {name: wait, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 5}}
      responses:
        '200':
          description: Jobs (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {$ref: '#/components/schemas/AgentJob'}}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
    post:
      tags: [Endpoint agent]
      summary: Report a job's state or result (device credential)
      description: >
        Idempotent for a repeated identical final state; a conflicting final state, a cancelled/expired job, or a state going back to
        running is 409. Output is credential-redacted and capped before storage. A late real result replaces a server-side result_lost.
      security: [{deviceAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentJobReport'}
      responses:
        '200': {description: "Recorded", content: {application/json: {schema: {$ref: '#/components/schemas/Ok'}}}}
        '401': {description: "Credential invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Unknown job for this device", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "Conflict", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 256 KiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "Invalid body", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_installer:
    post:
      tags: [Endpoint agent]
      summary: Download the stamped per-department installer with an enrollment token (for RMM, Intune, GPO scripts)
      description: >
        Public, token-gated. The enrollment token goes in the JSON or form body (or an Authorization Bearer header), NEVER in the query string
        (a token in the URL is refused with 400 so it stays out of access logs). Returns the current agent executable for the architecture
        with the department's installer payload and a 52-byte footer appended (see docs/ENDPOINT_AGENT.md section 'Stamped installer format'),
        streamed with an exact Content-Length. Any token that is not usable now (unknown, wrong, revoked, expired, used up) gets the same
        generic 404. Rate limited per address and per token from the database (429 + Retry-After). Successes and rejections are audited.
        The download does not consume an enrollment use; enrolling does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arch]
              properties:
                token: {type: string, description: "rvte1.<selector>.<secret>; may instead be sent as Authorization Bearer"}
                arch: {type: string, enum: [amd64, arm64]}
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [arch]
              properties:
                token: {type: string}
                arch: {type: string, enum: [amd64, arm64]}
      responses:
        '200':
          description: The stamped installer (RivetIT-Agent-Setup-<department>-<arch>.exe)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: "Token supplied in the query string (code token_in_url)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '403': {description: "Service disabled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Generic: the token is not usable", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '405': {description: "Use POST", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "No published binary for that architecture, or no https service URL (code unavailable)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '413': {description: "Body over 4 KiB", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "token or arch missing or invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Too many requests (Retry-After header)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /agent_update:
    get:
      tags: [Endpoint agent]
      summary: Download the hosted agent release this device is currently offered (device credential)
      description: >
        Streams the UNSTAMPED agent executable of the server-hosted release named by the update manifest (its url points here). Only the release
        the manifest offers THIS device right now is served, only for its own architecture, and only while the stored file still matches the
        manifest SHA-256. Anything else is a generic 404. Content-Length exact, nosniff, no-store.
      security: [{deviceAuth: []}]
      parameters:
        - {name: arch, in: query, required: true, schema: {type: string, enum: [amd64, arm64]}}
        - {name: version, in: query, required: true, schema: {type: string, example: 1.2.0}}
      responses:
        '200':
          description: The agent executable
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {description: "Credential invalid_token, revoked or expired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '404': {description: "Not offered to this device (or damaged)", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '422': {description: "arch or version invalid", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '429': {description: "Rate limited", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '503': {description: "The stored binary is missing or failed its integrity check", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices:
    get:
      tags: [Endpoint agent]
      summary: List endpoint agent devices in the caller's departments
      description: Needs a user token and RMM (module_rmm) view access. Module-only logins and API keys get 403.
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/EndpointDevice'}}
                  total: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /endpoint_devices/{id}:
    get:
      tags: [Endpoint agent]
      summary: Device detail with inventory, checks and recent jobs
      description: A device outside the caller's departments is a 404 (indistinguishable from a missing one). Job output needs module_rmm_scripts level 2.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: "Device", content: {application/json: {schema: {$ref: '#/components/schemas/EndpointDevice'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /endpoint_devices/{id}/jobs:
    get:
      tags: [Endpoint agent]
      summary: Job history for a device
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: "Jobs", content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {type: object}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Endpoint agent]
      summary: Queue a maintenance job (PowerShell, saved script, collect, reboot)
      description: >
        Authorization is decided server-side per call: free-form PowerShell needs module_rmm_scripts level 3, a saved script, reboot or
        collect level 2, always with module_rmm view access and the device's department. Module-only logins are refused. A reboot or any
        destructive job needs "confirm": true and is never retried automatically.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EndpointJobRequest'}
      responses:
        '201': {description: "Queued", content: {application/json: {schema: {type: object, properties: {job_id: {type: string}, state: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {description: "Invalid or confirmation_required", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices/{id}/jobs/{job_id}/cancel:
    post:
      tags: [Endpoint agent]
      summary: Cancel a queued job
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: job_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: "Only a queued job can be cancelled", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /endpoint_devices/{id}/remote:
    post:
      tags: [Endpoint agent]
      summary: Launch a MeshCentral remote session for a device
      description: >
        Needs module_rmm_remote_connect, module_rmm view, the device's department, and a device mapped to a MeshCentral node. Returns a
        one-time login URL minted for this request (never stored or logged) and a safe session id. Unmapped is 404, offline/not
        configured/retired 409 (set force to launch an offline-looking device anyway), MeshCentral unreachable 503.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {force: {type: boolean}}}
      responses:
        '200': {description: "Launch URL", content: {application/json: {schema: {type: object, properties: {url: {type: string}, session_id: {type: string}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: "Not found, or code unmapped", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '409': {description: "device_offline, not_configured or device_retired", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
        '503': {description: "MeshCentral unavailable", content: {application/json: {schema: {$ref: '#/components/schemas/AgentError'}}}}
  /oauth/token:
    post:
      tags: [Integration]
      summary: OAuth2 client-credentials token for an integration client
      description: >
        Public (no Bearer). `application/x-www-form-urlencoded` with `grant_type=client_credentials`, `client_id` and `client_secret`
        (or HTTP Basic). Optional `scope` (space separated; must be a subset of the client's scopes, default all of them).
        Returns a signed access token valid for 10 minutes that is accepted ONLY on `/lms/*`, `/employees/*` and `/departments/*`. Every authentication failure is the same
        401 `invalid_client`; repeated failures per IP and per client are throttled (429). Clients are managed in
        Administration > API Keys.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type: {type: string, enum: [client_credentials]}
                client_id: {type: string, example: ic_0123456789abcdef0123}
                client_secret: {type: string, format: password}
                scope: {type: string, example: "lms:read lms:completions:read"}
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationToken'}
        '400': {description: "invalid_request, unsupported_grant_type or invalid_scope", content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}}
        '401': {description: "invalid_client", content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}}
        '429': {description: "rate_limited (Retry-After)", content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}}
  /lms/courses:
    get:
      tags: [Integration]
      summary: Published course catalog
      description: Scope `lms:read`. Published, non-archived courses only; each is its latest published revision. Limited to the client's department scope (all departments, or only courses linked to its departments by a live rule, a rule naming one of its people, or an assignment or completion of one of its people); `departments` and `requirements` list only what touches the allowed departments. Cursor paging, incremental sync with `updated_since`.
      security: [{integrationAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IntLimit'}
        - {$ref: '#/components/parameters/IntCursor'}
        - {$ref: '#/components/parameters/IntUpdatedSince'}
      responses:
        '200': {description: Courses, content: {application/json: {schema: {$ref: '#/components/schemas/LmsCoursePage'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
  /lms/courses/{id}:
    get:
      tags: [Integration]
      summary: One published course
      description: Scope `lms:read`. `id` is the course id from the list (12 characters). Unpublished, archived, unknown and out-of-department-scope ids are all the same 404.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Course, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/LmsCourse'}}}}}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /lms/assignments:
    get:
      tags: [Integration]
      summary: List assignments
      description: Scope `lms:read`. Only assignments of people in the client's department scope. Filters `employee` (RivetIT id), `odoo_employee_id`, `course`, `status` (open, completed, waived, cancelled), `external_system`, `external_ref`, `updated_since`.
      security: [{integrationAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IntLimit'}
        - {$ref: '#/components/parameters/IntCursor'}
        - {$ref: '#/components/parameters/IntUpdatedSince'}
        - {name: employee, in: query, schema: {type: string}}
        - {name: odoo_employee_id, in: query, schema: {type: string}}
        - {name: course, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [open, completed, waived, cancelled]}}
        - {name: external_system, in: query, schema: {type: string}}
        - {name: external_ref, in: query, schema: {type: string}}
      responses:
        '200': {description: Assignments, content: {application/json: {schema: {$ref: '#/components/schemas/LmsAssignmentPage'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
    post:
      tags: [Integration]
      summary: Create (or reuse) an assignment
      description: >
        Scope `lms:assign`. `Idempotency-Key` is required: the same key with the same body replays the stored response (header
        `Idempotent-Replay: true`), the same key with a different body is 422 `idempotency_key_reuse`; keys are kept 24 hours and only
        successful results are stored. The employee is identified by `odoo_employee_id` or `rivetit_id` (never by name). The course must
        have a published revision. Created through the assignment engine, so the training ledger stays valid. 201 when a new assignment
        was created, 200 when an open assignment for the employee and course (or the same external reference) already existed.
        The employee and the course must be inside the client's department scope; outside it the answer is exactly the one for an unknown
        employee or course (422 `employee_not_found` / `course_not_found`), and an external_ref held outside the scope is the same 409 `external_ref_conflict`.
      security: [{integrationAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LmsAssignmentCreate'}
      responses:
        '200': {description: Existing assignment reused (or idempotent replay of a 200), content: {application/json: {schema: {$ref: '#/components/schemas/LmsAssignmentResult'}}}}
        '201': {description: Assignment created, content: {application/json: {schema: {$ref: '#/components/schemas/LmsAssignmentResult'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '409': {description: "external_ref_conflict, assignment_waived, already_current or idempotency_in_progress", content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}}
        '422': {description: "Validation: invalid_employee, employee_not_found, employee_ambiguous, employee_mismatch, employee_not_eligible, course_not_found, course_not_published, invalid_due_on, due_on_in_past, idempotency_key_reuse, ...", content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}}
  /lms/assignments/{id}:
    get:
      tags: [Integration]
      summary: One assignment
      description: Scope `lms:read`. `id` looks like `asg_123`. An assignment of a person outside the client's department scope is the same 404 as an unknown id.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, example: asg_123}}
      responses:
        '200': {description: Assignment, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/LmsAssignment'}}}}}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /lms/completions:
    get:
      tags: [Integration]
      summary: List completions
      description: >
        Scope `lms:completions:read`. Completion records are never deleted; a corrected record is `voided` or `superseded` and stays listed.
        Filters `employee`, `odoo_employee_id`, `course`, `assignment`, `status` (completed, voided, superseded), `updated_since`.
      security: [{integrationAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IntLimit'}
        - {$ref: '#/components/parameters/IntCursor'}
        - {$ref: '#/components/parameters/IntUpdatedSince'}
        - {name: employee, in: query, schema: {type: string}}
        - {name: odoo_employee_id, in: query, schema: {type: string}}
        - {name: course, in: query, schema: {type: string}}
        - {name: assignment, in: query, schema: {type: string, example: asg_123}}
        - {name: status, in: query, schema: {type: string, enum: [completed, voided, superseded]}}
      responses:
        '200': {description: Completions, content: {application/json: {schema: {$ref: '#/components/schemas/LmsCompletionPage'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
  /lms/completions/{id}:
    get:
      tags: [Integration]
      summary: One completion
      description: Scope `lms:completions:read`. `id` looks like `cmp_123`. A completion of a person outside the client's department scope is the same 404 as an unknown id.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, example: cmp_123}}
      responses:
        '200': {description: Completion, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/LmsCompletion'}}}}}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /lms/completions/{id}/evidence:
    get:
      tags: [Integration]
      summary: The completion's evidence file
      description: Scope `lms:evidence:read`. Streamed through the API after the same visibility check the web endpoint applies (the file must be referenced by the completion). 404 when there is no file or it may not be served.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, example: cmp_123}}
      responses:
        '200':
          description: The file (PDF, JPEG or PNG), as an attachment
          content:
            application/pdf: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /employees:
    get:
      tags: [Integration]
      summary: Employee directory
      description: |
        Scope `directory:read` only (no `lms:*` scope grants it). Employees are RivetIT contacts; the identity key for the QMS is `odoo_employee_id`
        (from the Odoo directory link; null when the person is not linked). Deactivated people stay in the feed with `active: false`
        (terminated or archived) so the QMS can deprovision them. Limited to the client's department scope: a restricted client sees only
        the employees of its departments; `manager_id` is null when the manager is outside that scope. Ascending id, cursor paging,
        incremental sync with `updated_since`. Only name, work email and job title are exposed - no phone, PIN, address or notes.
      security: [{integrationAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IntLimit'}
        - {$ref: '#/components/parameters/IntCursor'}
        - {$ref: '#/components/parameters/IntUpdatedSince'}
        - {name: department_id, in: query, schema: {type: string}, description: "Only the employees of this department (RivetIT id)"}
        - {name: odoo_employee_id, in: query, schema: {type: string}}
      responses:
        '200': {description: Employees, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryEmployeePage'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
  /employees/{id}:
    get:
      tags: [Integration]
      summary: One employee
      description: Scope `directory:read`. `id` is the RivetIT id from the list. Unknown, malformed and out-of-department-scope ids are all the same 404. A deactivated employee is returned with active set to false.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, example: "123"}}
      responses:
        '200': {description: Employee, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/DirectoryEmployee'}}}}}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /departments:
    get:
      tags: [Integration]
      summary: Department directory
      description: |
        Scope `directory:read` only. Departments are RivetIT clients (CRM leads are not departments). Archived and inactive departments stay in the
        feed (`active: false`). Limited to the client's department scope; `parent_id` and `head_employee_id` are null when they point outside it.
        Ascending id, cursor paging, incremental sync with `updated_since`.
      security: [{integrationAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IntLimit'}
        - {$ref: '#/components/parameters/IntCursor'}
        - {$ref: '#/components/parameters/IntUpdatedSince'}
      responses:
        '200': {description: Departments, content: {application/json: {schema: {$ref: '#/components/schemas/DirectoryDepartmentPage'}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
  /departments/{id}:
    get:
      tags: [Integration]
      summary: One department
      description: Scope `directory:read`. Unknown, malformed and out-of-department-scope ids are all the same 404.
      security: [{integrationAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, example: "7"}}
      responses:
        '200': {description: Department, content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/DirectoryDepartment'}}}}}}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '404': {$ref: '#/components/responses/IntegrationNotFound'}
  /integrations/qms/events:
    post:
      tags: [Integration]
      summary: Signed event from the QMS
      description: |
        Scope `quality:events`. Served only while the Quality module and "Accept events from the QMS" are on (otherwise `503 module_disabled`). The request must ALSO carry
        `X-Rivet-Signature-V2: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" with the inbound signing secret>`; the timestamp must be within 5 minutes
        (and not more than 1 minute ahead). The body is a JSON object of at most 64 KiB with `id` (8 to 64 characters, unique per event), `type`, `schema_version` (1),
        `occurred_at` and `data`. A repeat of an event id with the same body is acknowledged as `duplicate` and not processed again; the same id with a different body is
        `409 event_id_reuse`. Types: `qms.employee.mapped` (`qms_id` plus `rivetit_id` or `odoo_employee_id`; never matched by name), `qms.department.mapped`
        (`qms_id`, `rivetit_id`), `qms.sync.requested` (`streams`), `qms.requirement.changed` (`external_ref`); an unknown type is recorded as `ignored`.
      security: [{integrationAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, schema_version, occurred_at, data]
              properties:
                id: {type: string, example: "0f8a3c52-6b1e-4d27-9a64-3d1f0c9e7b21"}
                type: {type: string, example: qms.employee.mapped}
                schema_version: {type: integer, example: 1}
                occurred_at: {type: string, example: "2026-11-01T14:03:22Z"}
                data: {type: object, example: {qms_id: "p-2291", odoo_employee_id: "1842"}}
      parameters:
        - {name: X-Rivet-Signature-V2, in: header, required: true, schema: {type: string, example: "t=1793500000,v1=eb6c6837bb9f51d8a510764647b54f5b154e6457a0876faad02f7dec3bc7dabe"}}
      responses:
        '200': {description: Accepted, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [processed, ignored, duplicate]}, id: {type: string}}}}}}
        '400': {$ref: '#/components/responses/IntegrationBadRequest'}
        '401': {$ref: '#/components/responses/IntegrationUnauthorized'}
        '403': {$ref: '#/components/responses/IntegrationForbidden'}
        '409': {description: The event id was already used with a different body}
        '413': {description: Body larger than 64 KiB}
        '415': {description: Send application/json}
        '422': {description: Unsupported schema_version, or the event could not be applied (unknown or ambiguous person or department)}
        '503': {description: The Quality module (or inbound events) is switched off}
  /portal_auth:
    post:
      tags: [Employee portal]
      summary: Employee sign-in (department portal login)
      description: >
        Signs in a department-portal login (local password, same rules as the web portal sign-in: active, not archived, contact and department
        not archived, portal switched on, 2FA honoured). Returns a token for the /portal_* endpoints only; it is not a staff token and staff tokens
        do not work there. Five failures lock the login for five minutes. Single sign-on accounts cannot use this. A login that needs 2FA answers
        `{requires_2fa: true}` until `totp_code` is sent; an account that must enrol in 2FA gets 403 (set it up in the web portal).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, description: The portal login email}
                password: {type: string}
                totp_code: {type: string}
                device_name: {type: string}
      responses:
        '200':
          description: Signed in (token) or 2FA needed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  requires_2fa: {type: boolean}
                  contact: {type: object, properties: {id: {type: integer}, name: {type: string}, department_id: {type: integer}}}
        '400': {description: username and password required}
        '401': {description: Invalid credentials or 2FA code}
        '403': {description: 2FA enrolment required}
        '429': {description: Too many attempts}
    delete:
      tags: [Employee portal]
      summary: Sign this device out (revokes the employee token)
      security: [{portalBearer: []}]
      responses:
        '200': {description: Signed out}
  /portal_home:
    get:
      tags: [Employee portal]
      summary: The employee home in one call
      description: Announcements, open requests, devices, approvals waiting (count), checklist, popular and recent help articles and the unread notification count. Scoped to the token's contact and department.
      security: [{portalBearer: []}]
      responses:
        '200': {description: Employee home, content: {application/json: {schema: {$ref: '#/components/schemas/PortalHome'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal_devices:
    get:
      tags: [Employee portal]
      summary: My devices
      description: Devices assigned to the employee with OS, status, warranty (date, days left, state), last seen (agent check-in or RMM link) and restart pending. No credentials, IPs or notes.
      security: [{portalBearer: []}]
      responses:
        '200': {description: Devices, content: {application/json: {schema: {type: object, properties: {devices: {type: array, items: {$ref: '#/components/schemas/PortalDevice'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal_devices/{id}:
    get:
      tags: [Employee portal]
      summary: One of my devices
      security: [{portalBearer: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Device, content: {application/json: {schema: {type: object, properties: {device: {$ref: '#/components/schemas/PortalDevice'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Not assigned to the caller (or no such asset)}
  /portal_checklist:
    get:
      tags: [Employee portal]
      summary: My onboarding / offboarding checklist
      description: Read-only; no instructions, automation settings or errors, and automated (action) tasks are left out. `checklist` is null when the employee has none.
      security: [{portalBearer: []}]
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  checklist:
                    nullable: true
                    type: object
                    properties:
                      type: {type: string, enum: [onboarding, offboarding]}
                      status: {type: string}
                      template: {type: string}
                      done: {type: integer}
                      total: {type: integer}
                      tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            title: {type: string}
                            owner: {type: string}
                            state: {type: string, enum: [todo, not_started, awaiting_approval, done]}
                            required: {type: boolean}
                            due_at: {type: string, nullable: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal_announcements:
    get:
      tags: [Employee portal]
      summary: Announcements for the employee
      description: Published, not expired, for all departments or the caller's own department. Plain text body.
      security: [{portalBearer: []}]
      responses:
        '200': {description: Announcements, content: {application/json: {schema: {type: object, properties: {announcements: {type: array, items: {$ref: '#/components/schemas/PortalAnnouncement'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /portal_notifications:
    get:
      tags: [Employee portal]
      summary: My notification feed
      description: Announcements, replies and closures on the employee's requests, approvals waiting, due checklist tasks and device warranties running out. Built from existing data; nothing is sent.
      security: [{portalBearer: []}]
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        type: {type: string, enum: [announcement, reply, closed, approval, task, warranty]}
                        title: {type: string}
                        detail: {type: string}
                        link: {type: string}
                        at: {type: string}
                        sticky: {type: boolean}
                        unread: {type: boolean}
                        severity: {type: string, enum: [info, important, urgent]}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Employee portal]
      summary: Mark the feed as read
      description: Sticky items (an approval waiting, a due task, a warranty ending) stay unread until dealt with.
      security: [{portalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [action], properties: {action: {type: string, enum: [mark_read]}}}
      responses:
        '200': {description: Marked, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, unread: {type: integer}}}}}}
        '422': {description: Unknown action}
components:
  securitySchemes:
    portalBearer:
      type: http
      scheme: bearer
      description: Employee token from POST /portal_auth (a department-portal login). Works only on the /portal_* endpoints.
    integrationClient:
      type: oauth2
      description: >
        Primary machine authentication. OAuth2 client credentials: POST /oauth/token with grant_type=client_credentials, the integration
        client's Client ID and secret (form body or HTTP Basic) returns a 10 minute signed access token; send it as a Bearer token. The
        token carries the scopes the client holds (ask for fewer with the `scope` parameter). Deny by default, no wildcard; the client's
        department scope applies.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            lms:read: Read the published course catalog and assignments
            lms:assign: Create (or reuse) training assignments
            lms:completions:read: Read training completions
            lms:evidence:read: Download completion evidence files
            directory:read: Read the employee and department directory
            quality:events: Send signed Quality events from the QMS (POST /integrations/qms/events)
          api:alerts:read: Read alerts
          api:alerts:write: Write alerts
          api:alerts:delete: Delete alerts
          api:appointments:read: Read appointments
          api:appointments:write: Write appointments
          api:appointments:delete: Delete appointments
          api:assets:read: Read assets
          api:assets:write: Write assets
          api:assets:delete: Delete assets
          api:clients:read: Read clients
          api:clients:write: Write clients
          api:clients:delete: Delete clients
          api:contacts:read: Read contacts
          api:contacts:write: Write contacts
          api:contacts:delete: Delete contacts
          api:contracts:read: Read contracts
          api:contracts:write: Write contracts
          api:contracts:delete: Delete contracts
          api:dashboard:read: Read dashboard
          api:dashboard:write: Write dashboard
          api:dashboard:delete: Delete dashboard
          api:kb:read: Read kb
          api:kb:write: Write kb
          api:kb:delete: Delete kb
          api:milestones:read: Read milestones
          api:milestones:write: Write milestones
          api:milestones:delete: Delete milestones
          api:outtakes:read: Read outtakes
          api:outtakes:write: Write outtakes
          api:outtakes:delete: Delete outtakes
          api:projects:read: Read projects
          api:projects:write: Write projects
          api:projects:delete: Delete projects
          api:relationships:read: Read relationships
          api:relationships:write: Write relationships
          api:relationships:delete: Delete relationships
          api:reports:read: Read reports
          api:reports:write: Write reports
          api:reports:delete: Delete reports
          api:search:read: Read search
          api:search:write: Write search
          api:search:delete: Delete search
          api:tasks:read: Read tasks
          api:tasks:write: Write tasks
          api:tasks:delete: Delete tasks
          api:ticket_attachments:read: Read ticket attachments
          api:ticket_attachments:write: Write ticket attachments
          api:ticket_attachments:delete: Delete ticket attachments
          api:ticket_categories:read: Read ticket categories
          api:ticket_categories:write: Write ticket categories
          api:ticket_categories:delete: Delete ticket categories
          api:ticket_views:read: Read ticket views
          api:ticket_views:write: Write ticket views
          api:ticket_views:delete: Delete ticket views
          api:tickets:read: Read tickets
          api:tickets:write: Write tickets
          api:tickets:delete: Delete tickets
          api:worksheets:read: Read worksheets
          api:worksheets:write: Write worksheets
          api:worksheets:delete: Delete worksheets
    integrationAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /oauth/token (an integration client, 10 minutes). It reaches a route only if it holds that route's scope (lms:*, directory:read, api:<resource>:read|write|delete); a route with no scope answers 403.
    bearerAuth:
      type: http
      scheme: bearer
      description: User session token issued by POST /api/v1/auth (a signed-in person, e.g. the mobile app). Not an integration credential.
    deviceAuth:
      type: http
      scheme: bearer
      description: Per-device credential issued by POST /agent_enroll (256-bit, only its SHA-256 stored, rotatable and revocable). Not a user token.
  parameters:
    IntLimit:
      name: limit
      in: query
      schema: {type: integer, default: 50, minimum: 1, maximum: 200}
    IntCursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page
      schema: {type: string}
    IntUpdatedSince:
      name: updated_since
      in: query
      description: RFC 3339 timestamp; only records changed at or after it
      schema: {type: string, format: date-time}
    IdPath:
      name: id
      in: path
      required: true
      schema: {type: integer}
    PageParam:
      name: page
      in: query
      schema: {type: integer, default: 1, minimum: 1}
    LimitParam:
      name: limit
      in: query
      schema: {type: integer, default: 20}
    SearchParam:
      name: search
      in: query
      schema: {type: string}
    YearParam:
      name: year
      in: query
      schema: {type: integer}
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Ok'}
    ReportObject:
      description: Report payload (shape varies by report; always a JSON object)
      content:
        application/json:
          schema: {type: object}
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MethodNotAllowed:
      description: HTTP method not allowed for this resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Rate limit exceeded (see Retry-After header)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    IntegrationBadRequest:
      description: invalid_limit, invalid_cursor, invalid_updated_since, invalid_department_id, invalid_odoo_employee_id, invalid_status, invalid_json, idempotency_key_required or idempotency_key_invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}
    IntegrationUnauthorized:
      description: invalid_token (missing, expired, revoked, wrong audience, bad signature) or unauthorized
      content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}
    IntegrationForbidden:
      description: insufficient_scope (the token does not carry the scope the route needs)
      content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}
    IntegrationNotFound:
      description: not_found (unknown, unpublished or not servable; the two are not distinguished)
      content: {application/json: {schema: {$ref: '#/components/schemas/IntegrationError'}}}
  schemas:
    PortalAnnouncement:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        body: {type: string, description: Plain text}
        severity: {type: string, enum: [info, important, urgent]}
        pinned: {type: boolean}
        all_departments: {type: boolean}
        published_at: {type: string}
        expires_at: {type: string, nullable: true}
    PortalDevice:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        type: {type: string}
        make: {type: string}
        model: {type: string}
        serial: {type: string}
        os: {type: string, nullable: true}
        status: {type: string}
        purchase_date: {type: string, nullable: true}
        install_date: {type: string, nullable: true}
        warranty_expires: {type: string, nullable: true}
        warranty_days_left: {type: integer, nullable: true}
        warranty_state: {type: string, enum: [ok, expiring, expired, unknown]}
        last_seen: {type: string, nullable: true}
        seen_state: {type: string, enum: [online, recent, stale, unknown]}
        seen_age_s: {type: integer, nullable: true}
        reboot_pending: {type: boolean, nullable: true}
    PortalHome:
      type: object
      properties:
        contact: {type: object, properties: {id: {type: integer}, name: {type: string}, department_id: {type: integer}}}
        announcements: {type: array, items: {$ref: '#/components/schemas/PortalAnnouncement'}}
        open_requests: {type: array, items: {type: object, properties: {id: {type: integer}, number: {type: string}, subject: {type: string}, status: {type: string}, updated_at: {type: string, nullable: true}}}}
        devices: {type: array, items: {$ref: '#/components/schemas/PortalDevice'}}
        approvals_waiting: {type: integer}
        checklist: {type: object, nullable: true}
        kb: {type: object, properties: {popular: {type: array, items: {type: object}}, recent: {type: array, items: {type: object}}}}
        unread_notifications: {type: integer}
    AutomationRule:
      type: object
      properties:
        rule_id: {type: integer}
        name: {type: string}
        trigger_event: {type: string, example: ticket.created}
        conditions: {type: object, nullable: true, description: '{mode: all|any, conditions: [{field, op, value} | {mode, conditions: [...]}]}'}
        conditions_valid: {type: boolean}
        action_type: {type: string, enum: [create_ticket, send_webhook, notify_user, start_workflow, set_ticket_field, add_ticket_note, assign_ticket, send_mail, create_task, run_script, create_odoo_user, notify_chat, entra_disable_account, entra_add_to_groups]}
        action_config: {type: object}
        is_enabled: {type: boolean}
        priority: {type: integer}
        stop_on_match: {type: boolean}
        rate_limit_per_min: {type: integer}
        created_at: {type: string}
        imported_from_legacy_rule_id: {type: integer, nullable: true}
        summary: {type: string}
    AutomationRuleInput:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        trigger_event: {type: string, example: certificate.expiring}
        conditions: {type: object, nullable: true}
        action_type: {type: string}
        action_config: {type: object}
        is_enabled: {type: boolean}
        priority: {type: integer, minimum: 1, maximum: 9999}
        stop_on_match: {type: boolean}
        rate_limit_per_min: {type: integer, minimum: 1, maximum: 1000}
    AutomationRun:
      type: object
      properties:
        run_id: {type: integer}
        rule_id: {type: integer}
        event_type: {type: string}
        status: {type: string, enum: [ok, failed, throttled, loop_blocked, skipped]}
        message: {type: string}
        duration_ms: {type: integer}
        chain_depth: {type: integer}
        created_at: {type: string}
        attempt: {type: integer, description: Which try of the job queue this was (1-3)}
        max_attempts: {type: integer}
        source: {type: string, enum: [event, retry, manual]}
        retry_of_run_id: {type: integer, nullable: true}
        retried_by_run_id: {type: integer, nullable: true}
        can_rerun: {type: boolean}
    IntegrationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string, example: not_found}
            message: {type: string}
            correlation_id: {type: string, description: "Echo of X-Correlation-Id, or generated"}
    IntegrationToken:
      type: object
      properties:
        access_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 600}
        scope: {type: string, example: "lms:read lms:assign"}
    LmsEmployeeRef:
      type: object
      properties:
        rivetit_id: {type: string}
        odoo_employee_id: {type: string, nullable: true}
    LmsCourse:
      type: object
      properties:
        id: {type: string, description: "Stable course id (12 characters)"}
        kind: {type: string, enum: [training, document]}
        code: {type: string, nullable: true}
        external_code: {type: string, nullable: true, description: "The code the QMS knows the course by"}
        title: {type: string}
        description: {type: string, nullable: true}
        status: {type: string, enum: [published]}
        revision: {type: integer, description: "Published revision number"}
        revision_id: {type: integer}
        departments: {type: array, items: {type: string}, description: "Departments targeted by the course's active requirement rules"}
        est_minutes: {type: integer, nullable: true}
        validity_months: {type: integer, nullable: true}
        category: {type: string, nullable: true}
        requirements:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              required: {type: boolean}
              one_time: {type: boolean}
              all_people: {type: boolean}
        updated_at: {type: string, format: date-time}
    DirectoryEmployee:
      type: object
      properties:
        id: {type: string, description: "RivetIT contact id"}
        odoo_employee_id: {type: string, nullable: true, description: "Identity key: the Odoo employee id from the directory link"}
        name: {type: string}
        work_email: {type: string, nullable: true}
        job_title: {type: string, nullable: true}
        department_id: {type: string, nullable: true, description: "RivetIT department id (null = no department)"}
        odoo_department_id: {type: string, nullable: true}
        manager_id: {type: string, nullable: true, description: "Null when there is no manager or the manager is outside the client's department scope"}
        employment_status: {type: string, description: "pre-hire, active, leave, suspended, transfer_pending, termination_pending, terminated or archived"}
        active: {type: boolean, description: "false for terminated or archived people (tombstones): deprovision them"}
        updated_at: {type: string, format: date-time}
    DirectoryEmployeePage:
      type: object
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DirectoryEmployee'}}
