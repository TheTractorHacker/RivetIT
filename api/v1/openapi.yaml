            application/json:
              schema: {$ref: '#/components/schemas/ProjectTask'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Projects]
      summary: Same as PATCH (only the fields sent change)
      parameters:
        - {$ref: '#/components/parameters/IdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectTaskInput'}
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectTask'}
