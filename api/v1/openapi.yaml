    get:
      tags: [Notifications]
      summary: Server-Sent Events stream of new notifications
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema: {type: string}
  /approvals:
    get:
      tags: [Mobile]
      summary: Approvals the caller may decide right now (service catalog requests + workflow approval tasks)
      description: >
        Needs a user token (legacy API key denied) and Tickets (catalog) and/or Departments (workflow) access.
        Same rules as agent/service_catalog_approvals.php and the workflow run page; administrators also see every
        other pending catalog request (decided as an override). Module-only (limited) logins get 403.
      responses:
        '200':
          description: Pending approvals, oldest first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Mobile]
      summary: Approve or reject one approval
      description: >
        Goes through ServiceCatalogService::decide / WorkflowService::approveTask|rejectTask, so state machine,
        notifications, audit and ticket hold/release behave as on the web. An id that does not exist, is already
        decided, or is not addressed to the caller returns the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string, description: "approved, rejected, or pending_approval (a further catalog step is now waiting)"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Lost a race - the approval was decided in the meantime
        '422':
          description: Validation error (bad kind/id/decision, or a reject without a comment)
  /service_catalog:
    get:
      tags: [Mobile]
      summary: Active service catalog items with their request forms
      description: Needs a user token and Tickets access. popular = top 5 items of the last 30 days; recent = the caller's last 5 distinct items.
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Mobile]
      summary: Raise a ticket from a catalog item
      description: >
        Validated exactly like the web form (required, type, select choices, 500/5000 length caps); answers whose key is not a
        defined field are ignored. The caller is the requester. Needs Tickets edit access and access to client_id's department.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CatalogRequest'}
      responses:
        '201':
          description: Ticket created (held when the item needs approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  ticket_id: {type: integer}
                  status: {type: string, enum: [created, pending_approval]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Validation error; error holds the messages joined, errors the list
  /workflow_tasks:
    get:
      tags: [Mobile]
      summary: Open onboarding/offboarding checklist tasks
      description: >
        scope=mine (default): assigned to the caller plus unassigned tasks of runs the caller may access (Departments
        view + department access). scope=all: every open task of accessible runs, needs Departments edit access.
        status can also be running or rejected besides the listed values.
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [mine, all], default: mine}}
      responses:
        '200':
          description: Tasks, soonest due first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowTaskList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: Unknown scope
    post:
      tags: [Mobile]
      summary: Complete or skip a checklist task
      description: >
        Same rules as the web handlers (WorkflowService): blocked tasks and approval tasks cannot be completed by hand,
        skipping needs a reason, only administrators may skip an approval. Unknown and inaccessible tasks return the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowTaskAction'}
      responses:
        '200':
          description: Done; status is the task's new status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Validation error or a workflow rule (blocked, needs approval, reason required, admin only)
  /ticket_attachments:
    get:
      tags: [Mobile]
      summary: List a ticket's attachments, or download one
      description: >
        ticket_id=N lists. id=A&download=1 streams the file (Content-Disposition: attachment, nosniff, Cache-Control: no-store);
        id=A without download returns that one item's metadata. 403 for a ticket outside the caller's departments and for
        an unknown id (indistinguishable). Needs Tickets access.
      parameters:
        - {name: ticket_id, in: query, schema: {type: integer}}
        - {name: id, in: query, schema: {type: integer}}
        - {name: download, in: query, schema: {type: integer, enum: [1]}}
      responses:
        '200':
          description: Attachment list, or the file bytes when download=1
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketAttachmentList'}
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The file behind a known attachment is missing
    post:
      tags: [Mobile]
      summary: Upload one attachment (multipart)
      description: >
        Fields ticket_id, optional reply_id (must belong to the ticket) and file. Same extension allow-list as the web
        upload, plus content sniffing (an image extension must hold an image; script/markup content is refused), a
        check of every extension segment (shell.php.png is refused), a random stored name and the PHP/post size limits.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ticket_id, file]
              properties:
                ticket_id: {type: integer}
                reply_id: {type: integer}
                file: {type: string, format: binary}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  id: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413':
          description: File too large
        '422':
          description: Missing field, disallowed type or content
  /alerts:
    get:
      tags: [Alerts]
      summary: List combined RMM and backup alerts
      parameters:
        - {name: status, in: query, schema: {type: string, default: new}}
        - {name: severity, in: query, schema: {type: string, enum: [critical, error, warning, info]}}
        - {name: source, in: query, schema: {type: string, enum: [all, rmm, backup]}}
        - {name: client_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Alert'}}
                  total: {type: integer}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Alerts]
      summary: Acknowledge or resolve an alert
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
