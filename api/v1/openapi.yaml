      responses:
        '200':
          description: Key is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: string, example: "True"}
                  message: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /openapi:
    get:
      tags: [Meta]
      summary: This OpenAPI 3.0 spec as YAML (public)
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
  /docs:
