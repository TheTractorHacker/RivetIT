          nullable: true
          type: object
          properties:
            version: {type: string}
            url: {type: string}
            sha256: {type: string}
            signature: {type: string, description: base64 Ed25519 over the lowercase hex sha256}
            min_version: {type: string}
        server_time: {type: string, format: date-time}
        signing_key_id: {type: string}
    AgentJob:
      type: object
      properties:
        job_id: {type: string, format: uuid}
        attempt: {type: integer}
        type: {type: string, enum: [powershell, reboot, collect]}
        script: {type: string, nullable: true}
        params: {type: object}
        timeout_s: {type: integer}
        max_output_bytes: {type: integer}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        signature: {type: string, description: base64 Ed25519 over the canonical JSON of all other fields}
    AgentJobReport:
      type: object
      required: [job_id, attempt, state]
      properties:
        job_id: {type: string, format: uuid}
        attempt: {type: integer}
        state: {type: string, enum: [running, succeeded, failed, timed_out, cancelled]}
        exit_code: {type: integer, nullable: true}
        output: {type: string}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
    EndpointDevice:
      type: object
      properties:
        device_id: {type: integer}
        hostname: {type: string}
        asset_id: {type: integer, nullable: true}
        client_id: {type: integer}
        link_state: {type: string, enum: [linked, pending_approval, rejected]}
        status: {type: string, enum: [online, offline, stale, never]}
        last_checkin_at: {type: string, format: date-time, nullable: true}
        offline_since: {type: string, format: date-time, nullable: true}
        agent_version: {type: string}
        ring: {type: string}
        inventory: {type: object, nullable: true}
        checks: {type: array, items: {type: object}}
        jobs: {type: array, items: {type: object}}
    EndpointJobRequest:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [powershell, reboot, collect]}
        script: {type: string}
        script_id: {type: integer, description: A saved PowerShell script from the RMM script library}
        params: {type: object, description: "Scalar values only (strings, whole numbers, booleans)"}
        timeout_s: {type: integer}
        destructive: {type: boolean}
        confirm: {type: boolean, description: Required for reboot and destructive jobs}
