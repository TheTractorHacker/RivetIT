# RivetIT Redis - written once by deploy/install.sh (never overwritten afterwards, so edits and the changes
# Administration > Redis saves with CONFIG REWRITE are kept). Redis is an acceleration and coordination layer
# only: it never holds the only copy of anything, so there is no persistence and every feature fails open.

port 6380
bind 127.0.0.1 -::1
protected-mode yes
daemonize no
supervised no

# Nothing here is worth saving to disk.
save ""
appendonly no
dir /run/rivetit-redis

# Every key RivetIT writes has an expiry (locks, rate-limit counters, discovery cache), so evict only those.
maxmemory 256mb
maxmemory-policy volatile-lru

# Quiet, and not a general-purpose server.
loglevel notice
tcp-keepalive 300
databases 16
